<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Miss Aulia 💕💕</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<link rel="icon" type="image/png" href="favicon.png">
    
<body>

<!-- Pemutar Musik Kontainer -->
<div class="music-container">
  <!-- Gambar Piringan Hitam -->
  <div class="disc-wrapper" id="discWrapper">
    <img src="https://flaticon.com" alt="Piringan Hitam" class="vinyl-disc" id="vinylDisc">
  </div>
  
  <!-- Tombol Kontrol -->
  <button id="playPauseBtn" class="music-btn">▶ Play</button>
  
  <!-- File Audio (Ganti URL dengan link lagu Anda) -->
  <audio id="myAudio" src="https://youtu.be/k_KWSf9XKHk?si=zUhc2cmb8Jf2WOov"></audio>
</div>

    
    <div class="sparkles"></div>

<div class="album">

    <!-- Cover -->
    <div class="page active">

        <div class="cover">

        <img class="cover-image" src="images/cover.png" alt="Album Cover">

            <h1> Beautiful Girl Album Only </h1>

            <p>
                💕💕,<br>
                The most beautiful, cute and kind girl ✨
            </p>

            <button id="startBtn">
                Open Album 💕
            </button>

        </div>

    </div>

    <!-- Photo Page -->
    <div class="page">

        <div class="photo-card">

            <img id="albumImage" src="" alt="Photo">

<video id="albumVideo" controls playsinline style="display:none;">
    <source id="videoSource" src="">
</video>

            <div class="caption">
                <h2 id="photoTitle">
                    Memory
                </h2>

                <p id="photoNumber">
                    Photo 1
                </p>
            </div>

        </div>

    </div>

    <!-- Ending -->
    <div class="page">

        <div class="ending">

            <h1>Thank You 🤍</h1>

            <p>
                Every picture tells a story.<br>
                See you 🌸
            </p>

            <button id="restartBtn">
                View Again
            </button>

        </div>

    </div>

</div>

<div class="controls">

    <button id="prevBtn">
        ◀
    </button>

    <span id="pageIndicator">
        Cover
    </span>

    <button id="nextBtn">
        ▶
    </button>

</div>

  
<script src="script.js"></script>

</body>
</html>
